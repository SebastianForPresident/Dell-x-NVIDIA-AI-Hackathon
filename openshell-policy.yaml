# Minimal runtime policy for the crop-forensics API.
# MongoDB is the only native TCP destination; inference.local is managed by OpenShell.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /app
    - /opt/crop-forensics-venv
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  local_mongodb:
    name: local-mongodb
    endpoints:
      - host: host.openshell.internal
        port: 27017
        protocol: tcp
    binaries:
      - { path: /opt/crop-forensics-venv/bin/python }
      - { path: /opt/crop-forensics-venv/bin/python3 }
      - { path: /usr/local/bin/python3.14 }
